name: Build Windows

on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MA7ALAK-DZ-Windows
          path: |
            desktop/dist/*.exe
